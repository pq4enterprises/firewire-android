plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'

}

android {
    namespace 'com.fire.wire'
    compileSdk 33


    defaultConfig {
        applicationId "com.pioneer.nycfirewire"
        minSdk 21
        targetSdk 34
        versionCode 51
        versionName "3.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'com.google.android.gms:play-services-maps:19.0.0'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation 'androidx.gridlayout:gridlayout:1.0.0'


    implementation 'androidx.databinding:databinding-runtime:4.1.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.google.firebase:firebase-messaging:20.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //implementation "androidx.multidex:multidex:2.0.1"


    /*lib - HILT dagger*/
    implementation 'com.google.dagger:hilt-android:2.55'
    //kapt 'com.google.dagger:hilt-compiler:2.55'
    //implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.0.0-alpha03"
    implementation 'androidx.hilt:hilt-work:1.0.0'

    /*libs - livedata viewmodel*/
//    def lifecycle_version = '2.2.0'
//    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
//    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
//    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    def lifecycle_version = "2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
   // implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    /*image loader*/
    implementation("io.coil-kt:coil:1.4.0")

    /*lib - to get view model reference*/
    // implementation 'androidx.activity:activity-ktx:1.4.0'


    /*libs - retrofit*/
    def retrofit_version = '2.9.0'
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofit_version"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'


    /*circleview*/
    implementation 'de.hdodenhof:circleimageview:3.1.0'




    // Also declare the dependency for the Google Play services library and specify its version
    implementation 'com.google.android.gms:play-services-auth:20.0.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation 'org.apache.commons:commons-lang3:3.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation "androidx.work:work-runtime-ktx:2.7.1"

    implementation 'com.squareup.retrofit2:converter-simplexml:2.9.0'
    implementation "com.google.android.gms:play-services-wallet:18.0.0"
    implementation  'org.jsoup:jsoup:1.15.4'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'com.facebook.android:facebook-login:latest.release'
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
   // implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'
    implementation 'com.google.android.gms:play-services-auth:20.3.0'

    // Billing
//    def billing_version = "6.0.1"
//    implementation "com.android.billingclient:billing:$billing_version"
//
   // implementation "com.github.akshaaatt:Google-IAP:1.3.1"

    implementation 'com.android.billingclient:billing:6.0.1'
   // implementation 'com.android.billingclient:billing-ktx:6.0.1'



    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


}

